name: Add Team as Collaborator

on:
  workflow_dispatch:

jobs:
  add-team-collaborator:
    name: Add team-subhamay as Collaborator
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Add enterprise team as collaborator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Add team-subhamay with maintain permission
          gh api repos/subhamay-bhattacharyya-cfn/cloudformation-template/teams/19364086 \
          # gh api repos/${{ github.repository }}/teams/ent:team-subhamay \
            -X PUT \
            -f permission='maintain' \
            -f notification_setting='notifications_enabled'
          
          echo "✅ Team team-subhamay added with maintain permission"
      
      - name: Verify team access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Verify the team was added
          gh api repos/${{ github.repository }}/teams/ent:team-subhamay
