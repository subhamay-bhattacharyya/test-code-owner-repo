name: Add Team Members as Repository Collaborators

on:
  workflow_dispatch:

jobs:
  add-collaborators:
    name: Add team-subhamay members as Collaborators
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    strategy:
      matrix:
        username: 
          - bsubhamay
          - bsubhamay-approver
          - bsubhamay-approver-2
    
    steps:
      - name: Add ${{ matrix.username }} as collaborator
        run: |
          echo "Adding ${{ matrix.username }} with maintain permission..."
          
          gh api repos/${{ github.repository }}/collaborators/${{ matrix.username }} \
            -X PUT \
            -f permission='maintain' \
            -f notification_setting='notifications_enabled'
          
          if [ $? -eq 0 ]; then
            echo "✅ ${{ matrix.username }} added with maintain permission"
          else
            echo "❌ Failed to add ${{ matrix.username }}"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
      
      - name: Verify ${{ matrix.username }} access
        run: |
          echo "Verifying ${{ matrix.username }} access..."
          
          COLLAB=$(gh api repos/${{ github.repository }}/collaborators/${{ matrix.username }})
          PERMISSION=$(echo "$COLLAB" | jq -r '.permission')
          
          echo "Username: ${{ matrix.username }}"
          echo "Permission: $PERMISSION"
          
          if [ "$PERMISSION" = "maintain" ]; then
            echo "✅ Verified maintain permission"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
    
    outputs:
      status: success
  
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: add-collaborators
    if: success()
    
    steps:
      - name: Post Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## ✅ Team Members Added as Collaborators
          
          The following team members now have **maintain** permission:
          
          - ✅ **bsubhamay** (Subhamay Bhattacharyya)
          - ✅ **bsubhamay-approver** (Samsung)
          - ✅ **bsubhamay-approver-2** (Thomas)
          
          ### What they can do:
          - ✅ Be used in CODEOWNERS file
          - ✅ Review and approve PRs
          - ✅ Push to protected branches
          - ✅ Merge pull requests
          - ✅ Manage repository settings
          
          ### Next Steps:
          - [ ] Update CODEOWNERS to use team members or team reference
          - [ ] Test branch creation
          - [ ] Test CODEOWNERS in PR
          EOF
